- title: "An Autopsy of State Finance: How Transnational Legal Structures Insulate Policies from Politics."
  publication: "Full draft available."
  abstract: "This article shows how the transnational legal structures of state finance enable some policy funds to survive periods of state dismantling. Lawyers and bureaucrats insulate policy by intentionally distributing funding rules (how funds are raised), governance rules (how decisions are made), and disbursement rules (how funds are paid) across public–private and national–international jurisdictions. Drawing on environmental finance data, 70 in-depth interviews, and archival research, the article demonstrates policy insulation through a mixed-methods design of the Brazilian environmental state since 1990. First, through interviews and archival research, it shows how and why bureaucrats and lawyers opted for different transnational legal structures in the five main sources of environmental policy. Second, leveraging data that differentiate between resource commitment, allocation and disbursement, it shows that some resource flows survived Bolsonaro's dismantling attempts while others did not. It ties survival back to specific strategies that disperse transnational legal structures in loose ways, making legal attacks harder. For scholars of democratic backsliding, the anatomy of state finance highlights how dismantling is uneven and constrained when state capacities are dispersed beyond the national state. For sociologists of law and globalization, it shows how relationality and law matter beyond the household and financial markets and can also have positive unintended outcomes."

- title: "Putting Power into Boxes: Challenges and Advantages of Conducting Surveys with Elites."
  publication: "Under review."
  authors: "Graziella Moraes Silva, Matias Lopez, and Debora Thome"
  abstract: "While elite surveys have a long tradition in the social sciences, scholars have questioned their feasibility and analytical value, citing problems of sampling, access, and the limits of structured questionnaires. Drawing on metadata from over 300 elite samples across more than 60 countries, as well as our own mixed-method research with political, economic, and social elites in Brazil and South Africa, we reassess three recurrent critiques: that probabilistic sampling is ill-suited for elites, that elites are uniformly hard to survey, and that standardized instruments fail to capture elite attitudes. We show that probabilistic sampling can produce high-quality elite samples and defensible population-level estimates, and that structured questionnaires do not merely constrain expression but discipline elite respondents by predefining analytical categories and limiting rhetorical maneuvering. By compelling elites to position themselves within a shared classificatory space, surveys make variation and contradiction within elite worldviews empirically visible. We conclude that methodological choices in elite research should be guided less by assumptions about elites as a special population worthy of special methods than by clearly specified research questions, inferential aims, and substantive interests."

